name: Temp - Query fellow table

on:
  workflow_dispatch:
  push:
    branches: [claude/track-new-entries-b7nhdk]

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query cases submitted in the last 4 hours, joined with fellow name/email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          since=$(date -u -d "-8 hours" +%Y-%m-%dT%H:%M:%SZ)

          curl -sS "$SUPABASE_URL/rest/v1/cases?select=*&created_at=gte.$since&order=created_at.desc" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o cases_rows.json

          curl -sS "$SUPABASE_URL/rest/v1/fellow?select=user_id,full_name,email" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o fellow_rows.json

          echo "--- fellow rows count ---"
          python3 -c "import json; print(len(json.load(open('fellow_rows.json'))))"

          echo "--- unmatched auth user lookup ---"
          curl -sS "$SUPABASE_URL/auth/v1/admin/users/81919f3e-1fcc-427b-bceb-727a2fb2a161" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | python3 -m json.tool

          python3 - <<'PY'
          import json
          cases = json.load(open("cases_rows.json"))
          fellows = {f["user_id"]: f for f in json.load(open("fellow_rows.json")) if f["user_id"]}
          for c in cases:
              f = fellows.get(c["user_id"], {})
              c["fellow_full_name"] = f.get("full_name")
              c["fellow_email"] = f.get("email")
          json.dump(cases, open("cases_joined.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(cases, ensure_ascii=False, indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cases-last-4h
          path: cases_joined.json
