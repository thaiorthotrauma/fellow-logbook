name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Unit tests import modules that construct the Supabase client at module
    # load (e.g. casesApi.ts, staffApi.ts), which throws unless these are
    # set — no real Supabase project is contacted by these tests, so
    # placeholder values are enough to satisfy the constructor.
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Typecheck & build
        run: npm run build
